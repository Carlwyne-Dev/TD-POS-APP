<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sPOSify Remote Admin</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; background: #111; color: #fff; padding: 2rem; }
    h1 { color: #DF7A96; }
    table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
    th, td { padding: 1rem; text-align: left; border-bottom: 1px solid #333; }
    th { color: #888; font-weight: normal; }
    button { padding: 0.5rem 1rem; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-lock { background: #DF7A96; color: #fff; }
    .btn-unlock { background: #333; color: #fff; }
    .status-locked { color: #DF7A96; }
    .status-active { color: #4CAF50; }
  </style>
</head>
<body>
  <h1>sPOSify Remote Tracker</h1>
  <p>Manage installed devices and revoke access if necessary.</p>
  
  <table>
    <thead>
      <tr>
        <th>Device Name</th>
        <th>Device ID</th>
        <th>Last Seen</th>
        <th>Status</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="list">
      <tr><td colspan="5">Loading...</td></tr>
    </tbody>
  </table>

  <script>
    const PASS = 'sposify2026';
    
    async function load() {
      const res = await fetch('/api/devices', { headers: { 'Authorization': PASS } });
      const data = await res.json();
      const list = document.getElementById('list');
      list.innerHTML = '';
      
      const devices = Object.values(data).sort((a,b) => b.lastSeen - a.lastSeen);
      
      if(devices.length === 0) {
        list.innerHTML = '<tr><td colspan="5">No devices registered yet.</td></tr>';
        return;
      }

      devices.forEach(d => {
        const date = new Date(d.lastSeen).toLocaleString();
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><strong>${d.name}</strong></td>
          <td style="color: #666">${d.id}</td>
          <td>${date}</td>
          <td class="${d.locked ? 'status-locked' : 'status-active'}">${d.locked ? 'LOCKED' : 'ACTIVE'}</td>
          <td>
            <button onclick="toggleLock('${d.id}', ${!d.locked})" class="${d.locked ? 'btn-unlock' : 'btn-lock'}">
              ${d.locked ? 'Unlock Device' : 'Lock Device'}
            </button>
          </td>
        `;
        list.appendChild(tr);
      });
    }

    async function toggleLock(id, lockStatus) {
      if(!confirm(`Are you sure you want to ${lockStatus ? 'LOCK' : 'UNLOCK'} this device?`)) return;
      await fetch(`/api/toggle?deviceId=${id}&locked=${lockStatus}`, { headers: { 'Authorization': PASS } });
      load();
    }

    load();
  </script>
</body>
</html>
